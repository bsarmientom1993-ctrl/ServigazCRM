services:
  postgres:
    image: postgres:16-alpine
    container_name: servigaz_postgres
    restart: always
    environment:
      POSTGRES_USER: servigaz_user
      POSTGRES_PASSWORD: servigaz_password
      POSTGRES_DB: servigaz_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
